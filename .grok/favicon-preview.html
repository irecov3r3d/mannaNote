<!doctype html>
<html><head><style>
html,body{margin:0;padding:0;background:#6a6a6a;}
.row{display:flex;gap:20px;padding:24px;align-items:flex-end;}
.box{background:#222;padding:6px;border-radius:2px;}
svg.s16{width:16px;height:16px;display:block;}
svg.s32{width:32px;height:32px;display:block;}
svg.s64{width:64px;height:64px;display:block;}
</style></head>
<body>
<div class="row">
  <div class="box"><svg xmlns="http://www.w3.org/2000/svg" class=s16 viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#ebe6dc"/>
  <path d="M8 24 V9 L16 19 L24 9 V24" fill="none" stroke="#121314" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="8" y="26.2" width="16" height="2.4" rx="1.2" fill="#8d9a88"/>
</svg></div>
  <div class="box"><svg xmlns="http://www.w3.org/2000/svg" class=s32 viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#ebe6dc"/>
  <path d="M8 24 V9 L16 19 L24 9 V24" fill="none" stroke="#121314" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="8" y="26.2" width="16" height="2.4" rx="1.2" fill="#8d9a88"/>
</svg></div>
  <div class="box"><svg xmlns="http://www.w3.org/2000/svg" class=s64 viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#ebe6dc"/>
  <path d="M8 24 V9 L16 19 L24 9 V24" fill="none" stroke="#121314" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="8" y="26.2" width="16" height="2.4" rx="1.2" fill="#8d9a88"/>
</svg></div>
</div>
</body></html>
